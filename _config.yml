title: Taylor W. Killian
description: > # this means to ignore newlines until "baseurl:"
  Personal research webiste for Taylor W. Killian
permalink: ':title/'
baseurl: # the subpath of your site, e.g. /blog
url: "https://twkillian.github.io" # the base hostname & protocol for your site, e.g. http://example.com
site-twitter: "https://twitter.com/tw_killian" #if your site has a twitter account, enter it here

# Author Settings
author: Taylor W. Killian # add your name
author-img: TKillian_Headshot.jpg # add your photo
about-author: Senior Research Scientist # add description
twitter: tw_killian # add your Twitter handle
github: twkillian # add your Github handle
googlescholar: xA3RcaUAAAAJ&hl=en #Google Scholar
linkedin: taylor-w-killian # add your Linkedin handle
email: tkillian@cs.byu.edu # add your Email address

# Disqus (disabled)
# discus-identifier: mr-brown # add your discus identifier

# Tracker
# Google Analytics 4 measurement ID, emitted by _includes/analytics.html and
# only in production builds. Replaces the old empty `analytics:` key, which fed
# an obsolete analytics.js snippet and rendered a broken, no-op tag.
#
# This is the EXISTING GA4 property that already holds this site's history — the
# same property the retired UA-147627714-1 tag had been feeding indirectly. It
# is not a new one, so no history is lost or split.
#
# byu-adept-lab.github.io must carry this identical value. That is what lets
# GA4 stitch one session across both hostnames when a visitor follows the nav
# link to the lab site; the two sites stay separable via the `hostname`
# dimension. Cross-domain measurement is enabled once in the GA4 admin, listing
# both hostnames.
#
# In GA4 the value is shown under:
#   Admin > Data streams > (the web stream) > Measurement ID  (top right)
google_analytics: G-4261TQJZV6

# Build Settings
markdown: kramdown
future: true
plugins:
  - jekyll-sitemap
  - jekyll-paginate
  - jemoji
  - jekyll-feed

paginate: 8
paginate_path: "/page/:num"

# Collections
collections:
  research:
    output: true
    permalink: /research/:title/
  teaching:
    output: true
    permalink: /teaching/:title/

exclude: ["node_modules", "gulpfile.js", "package.json", "yarn.lock"]
